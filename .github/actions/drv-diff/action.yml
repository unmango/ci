name: Derivation diff
description: Evaluate checks and packages at the head and a base commit, and plan a build of the outputs whose derivation changed.

inputs:
  base:
    description: Commit to diff against; empty builds every output.
    default: ""
  systems:
    description: Space-separated systems to evaluate.
    default: x86_64-linux aarch64-linux aarch64-darwin
  full:
    description: Also build flakeModules.ci's nightly list.
    default: "false"

outputs:
  matrix:
    description: JSON array of { system, runner, packages, checks }, one per system with something to build.
    value: ${{ steps.plan.outputs.matrix }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: drv-diff/head
        persist-credentials: false

    - id: base
      if: inputs.base != ''
      # A force-push can leave the base commit gone; then everything builds.
      continue-on-error: true
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.base }}
        path: drv-diff/base
        persist-credentials: false

    - id: plan
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUTS: ${{ toJSON(inputs) }}
        HEAD: ${{ github.workspace }}/drv-diff/head
        BASE: ${{ steps.base.outcome == 'success' && format('{0}/drv-diff/base', github.workspace) || '' }}
      with:
        script: |
          const { run } = await import(`${process.env.ACTION_PATH}/diff.mjs`);
          const { HEAD: head, BASE: base, ACTION_PATH } = process.env;
          const inputs = { ...JSON.parse(process.env.INPUTS), head, base, "action-path": ACTION_PATH };
          await run({ exec, core, inputs });
