name: Renovate fixup
description: Commit an applied fixup patch to a Renovate branch, or label the branch's PR when the fixup failed.

inputs:
  step:
    description: push, to commit the staged changes, or label, after a failed fixup.
    required: true
  token:
    description: For push, a token that can write the branch's contents; for label, one with checks:read, contents:read and pull-requests:write.
    required: true
  repository:
    description: owner/repo to act on.
    default: ${{ github.repository }}
  branch:
    description: The Renovate branch.
    default: ${{ github.ref_name }}
  sha:
    description: The commit the fixup ran on; push refuses to commit, and label to label, once the branch has moved.
    default: ${{ github.sha }}
  default-branch:
    description: Branch whose required result decides whether to label.
    default: ${{ github.event.repository.default_branch }}
  label:
    description: Label for a PR whose fixup failed.
    default: renovate:needs-human
  check-name:
    description: Name of the gate's check run.
    default: required
  app-id:
    description: App that must have created the check run (15368 is GitHub Actions).
    default: "15368"

outputs:
  oid:
    description: The fixup commit pushed, or empty.
    value: ${{ steps.fixup.outputs.oid }}
  refused:
    description: "true when push refused a symlink, submodule or workflow change."
    value: ${{ steps.fixup.outputs.refused }}
  pr:
    description: The PR labelled, or empty.
    value: ${{ steps.fixup.outputs.pr }}

runs:
  using: composite
  steps:
    - id: fixup
      shell: bash
      # Composite actions pass no INPUT_ variables of their own.
      env:
        INPUT_STEP: ${{ inputs.step }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_DEFAULT-BRANCH: ${{ inputs.default-branch }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_CHECK-NAME: ${{ inputs.check-name }}
        INPUT_APP-ID: ${{ inputs.app-id }}
      run: node --enable-source-maps "$GITHUB_ACTION_PATH/../../../dist/unmango-ci.mjs" renovate-fixup
