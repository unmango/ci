name: Renovate resume
description: After a red main turns green, tick the rebase checkbox on Renovate PRs whose required check failed.

inputs:
  token:
    description: Token with checks:read and pull-requests:write on the repository.
    default: ${{ github.token }}
  repository:
    description: owner/repo to act on.
    default: ${{ github.repository }}
  before:
    description: The commit main pointed at before this push.
    required: true
  check-name:
    description: Name of the gate's check run.
    default: required
  app-id:
    description: App that must have created the check run (15368 is GitHub Actions).
    default: "15368"
  branch-prefix:
    description: Head branch prefix of Renovate PRs.
    default: renovate/
  label:
    description: PRs carrying this label are left alone.
    default: renovate:needs-human
  depth:
    description: How many main commits to search for the previous completed run.
    default: "20"

outputs:
  ticked:
    description: JSON array of the PR numbers ticked.

runs:
  using: node24
  main: index.mjs
