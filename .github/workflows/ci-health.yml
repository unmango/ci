name: CI health

on:
  workflow_call:

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: read
    concurrency:
      # Two writers racing on a repo with no issue yet would each create one.
      group: ci-health-${{ github.event_name == 'pull_request' && github.run_id || github.repository }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHECK_NAME: required
      WINDOW_DAYS: 7
      THRESHOLD_MINUTES: 5
      # In a called workflow this is the caller's.
      WORKFLOW_REF: ${{ github.workflow_ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Collect gate results
        run: |
          set -euo pipefail
          branch=$(gh api "repos/$GH_REPO" --jq .default_branch)
          wf=${WORKFLOW_REF%@*}
          wf=${wf##*/}
          since=$(date -u -d "-$WINDOW_DAYS days" +%Y-%m-%dT%H:%M:%SZ)

          runs() {
            gh api "$@" "repos/$GH_REPO/actions/workflows/$wf/runs?branch=$branch&event=push&$query" \
              --jq '.workflow_runs[] | {id, created_at, run_started_at, html_url}' | jq -c .
          }

          gate() {
            while read -r run; do
              gh api --paginate "repos/$GH_REPO/actions/runs/$(jq -r .id <<<"$run")/jobs?per_page=100" \
                --jq '.jobs[] | select(.name == env.CHECK_NAME) | {conclusion, completed_at}' |
                jq -sc --argjson run "$run" '$run + (first // {})'
            done
          }

          query="per_page=100&created=%3E%3D$since" runs --paginate | gate >gate.jsonl
          # A quiet repo has nothing in the window, but still has a latest result.
          if ! jq -e 'select(.conclusion | IN("success", "failure", "timed_out"))' gate.jsonl >/dev/null; then
            query="per_page=50" runs | gate >gate.jsonl
          fi

          echo "BRANCH=$branch" >>"$GITHUB_ENV"
          echo "SINCE=$since" >>"$GITHUB_ENV"

      - name: Find the health issue
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/issues?labels=ci-health&state=open&sort=created&direction=asc&per_page=100" \
            --jq '[.[] | select(.pull_request == null)] | first // {}' >issue.json
          jq -r '.body // ""' issue.json | tr -d '\r' |
            sed -n 's/^<!-- ci-health \(.*\) -->$/\1/p' | head -n1 >prev.json
          # A hand-edited marker shouldn't fail the run.
          jq -e 'type == "object"' prev.json >/dev/null 2>&1 || echo '{}' >prev.json
          gh pr list --label renovate:needs-human --state open --limit 100 \
            --json number,title,url >needs-human.json

      - name: Render the report
        run: |
          set -euo pipefail
          jq -s \
            --arg since "$SINCE" \
            --argjson threshold "$THRESHOLD_MINUTES" \
            --slurpfile prev prev.json \
            -f /dev/stdin gate.jsonl >report.json <<'JQ'
          def pct($p): sort | if length == 0 then null else .[($p * length | ceil) - 1] end;
          map(select(.conclusion | IN("success", "failure", "timed_out"))) as $done
          | $prev[0] as $prev
          | ($done[0] // null) as $latest
          | (if $latest == null then "unknown" elif $latest.conclusion == "success" then "green" else "red" end) as $state
          | ($done | to_entries | map(select(.value.conclusion == "success")) | first | .key) as $green
          | ($done | map(select(.created_at >= $since))
              | map((.completed_at | fromdate) - (.run_started_at | fromdate))) as $durations
          | {
              state: $state,
              latest: $latest,
              red_since: (
                if $state != "red" then null
                elif $green != null then $done[$green - 1].created_at
                # The streak is older than anything fetched.
                elif $prev.state == "red" and $prev.red_since != null then $prev.red_since
                else $done[-1].created_at end
              ),
              runs: ($durations | length),
              p50: ($durations | pct(0.5)),
              p90: ($durations | pct(0.9)),
              threshold: ($threshold * 60)
            }
          | .slow = (.p50 != null and .p50 > .threshold)
          JQ

          jq -r \
            --arg branch "$BRANCH" \
            --arg check "$CHECK_NAME" \
            --arg days "$WINDOW_DAYS" \
            --arg run "$RUN_URL" \
            --slurpfile prs needs-human.json \
            -f /dev/stdin report.json >body.md <<'JQ'
          def dur: if . == null then "n/a" else floor | "\(. / 60 | floor)m \(. % 60)s" end;
          def when: fromdate | strftime("%Y-%m-%d %H:%M UTC");
          $prs[0] as $prs
          | "<!-- ci-health \({state, red_since, p50, p90} | tojson) -->",
            "",
            "| | |",
            "| --- | --- |",
            "| `\($branch)` | \(
                if .state == "unknown" then "No `\($check)` result yet"
                elif .state == "green" then "🟢 green ([run](\(.latest.html_url)))"
                else "🔴 red since \(.red_since | when) ([latest](\(.latest.html_url)))" end) |",
            "| `\($check)` p50, \($days) days | \(.p50 | dur)\(if .slow then " ⚠️ over \(.threshold | dur)" else "" end) |",
            "| `\($check)` p90, \($days) days | \(.p90 | dur) |",
            "| Runs, \($days) days | \(.runs) |",
            "| `renovate:needs-human` | \($prs | length) |",
            "",
            ($prs[] | "- [\(.title)](\(.url))"),
            (if ($prs | length) > 0 then "" else empty end),
            "Measured from a run's start to `\($check)` finishing, on pushes to `\($branch)`. [Updated](\($run)) \(now | todate | when)."
          JQ

          cat body.md >>"$GITHUB_STEP_SUMMARY"

      - name: Write the health issue
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          number=$(jq -r '.number // empty' issue.json)
          if [ -z "$number" ]; then
            gh label create ci-health --color 0e8a16 \
              --description "This repo's CI health report" 2>/dev/null || true
            url=$(gh issue create --title "CI health" --label ci-health --body-file body.md)
            number=${url##*/}
          else
            gh issue edit "$number" --body-file body.md
          fi

          if [ "$(gh issue view "$number" --json isPinned --jq .isPinned)" != true ]; then
            gh issue pin "$number" || echo "::warning::Could not pin #$number"
          fi

          state=$(jq -r .state report.json)
          if [ "$state" = red ]; then
            gh label create ci-health:red --color d73a4a \
              --description "main's gate is failing" 2>/dev/null || true
            gh issue edit "$number" --add-label ci-health:red
          elif [ "$state" = green ] && jq -e '.labels // [] | any(.name == "ci-health:red")' issue.json >/dev/null; then
            gh issue edit "$number" --remove-label ci-health:red
          fi
