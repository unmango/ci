name: CI health

on:
  workflow_call:
    inputs:
      workflow:
        description: Workflow file holding the required job.
        type: string
        default: ci.yml

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: read
    concurrency:
      # Two writers racing on a repo with no issue yet would each create one.
      group: ci-health-${{ github.event_name == 'pull_request' && github.run_id || github.repository }}
    steps:
      - uses: $/.github/actions/ci-health
        with:
          workflow: ${{ inputs.workflow }}
          write: ${{ github.event_name != 'pull_request' }}
