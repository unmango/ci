name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/nix-ci.yml
    permissions:
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    with:
      aarch64-linux: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # The path a fork PR takes. PRs only, so renovate-resume runs once on main.
  hosted:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/nix-ci.yml
    # GitHub checks every called job's permissions, even ones that won't run.
    permissions:
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    with:
      darwin: true
      linux: true

  # This repo's checks stand in for a collection's packages.
  # renovate-resume runs twice on main; the second tick is a no-op.
  collection:
    uses: ./.github/workflows/collection-ci.yml
    permissions:
      checks: read
      contents: read
      pull-requests: write
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  # Two fake packages; a dry run writes nothing.
  package-updates:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/package-updates.yml
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      list: printf 'alpha\nbeta\n'
      bump: test/fixtures/bump.sh
      dry-run: true

  # Its own context: on Hercules's, the real status would pass the gate.
  spoofed-status:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      CONTEXT: nix-ci-test/spoofed
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Post a spoofed status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state=success -f context="$CONTEXT"
          -f description="Spoofed status the Hercules gate must ignore"
      - id: gate
        continue-on-error: true
        uses: ./.github/actions/hercules-gate
        with:
          sha: ${{ env.SHA }}
          context: ${{ env.CONTEXT }}
          timeout-minutes: "1"
          interval-seconds: "10"
      - name: The gate rejected it
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          IGNORED: ${{ steps.gate.outputs.ignored }}
        run: |
          echo "outcome=$OUTCOME verdict=$VERDICT ignored=$IGNORED"
          [ "$OUTCOME" = failure ] && [ "$VERDICT" = timeout ] && [ "$IGNORED" -ge 1 ]

  required:
    needs: [nix, hosted, collection, package-updates, spoofed-status]
    # The weekly build reports through ci-health, not the gate.
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
