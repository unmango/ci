name: Renovate fixup

on:
  workflow_call:
    inputs:
      client-id:
        description: Client ID of the renovate-fixup App.
        type: string
        required: true
      app-slug:
        description: Slug of the renovate-fixup App, whose own pushes are skipped.
        type: string
        default: unmango-renovate-fixup
    secrets:
      RENOVATE_FIXUP_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  # Runs the branch's code, so it holds no token that can write.
  fixup:
    if: ${{ !github.event.deleted && github.actor != format('{0}[bot]', inputs.app-slug) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ github.token }}
      - run: nix run .#renovate-fixup
      - id: diff
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/fixup.patch"
          if [ -s "$RUNNER_TEMP/fixup.patch" ]; then echo changed=true >> "$GITHUB_OUTPUT"; fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-fixup
          path: ${{ runner.temp }}/fixup.patch
          retention-days: 1

  # Runs no code from the branch.
  push:
    needs: [fixup]
    if: needs.fixup.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.RENOVATE_FIXUP_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: renovate-fixup
          path: ${{ runner.temp }}
      - run: git apply --index "$RUNNER_TEMP/fixup.patch"
      - uses: $/.github/actions/renovate-fixup
        with:
          step: push
          token: ${{ steps.app-token.outputs.token }}

  label:
    needs: [fixup]
    if: failure() && needs.fixup.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      pull-requests: write
    steps:
      - uses: $/.github/actions/renovate-fixup
        with:
          step: label
          token: ${{ github.token }}
